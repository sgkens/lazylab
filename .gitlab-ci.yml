# App checks run before documentation publishing. No live GitLab or BugKB credentials required.

stages:
  - verify
  - docs

default:
  image: oven/bun:1.3.11

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Use the MR pipeline instead of duplicating it for the same branch push.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

app:check:
  stage: verify
  rules:
    - when: on_success
  cache:
    key:
      prefix: app-bun-1.3.11
      files: [bun.lock]
    paths: [node_modules/]
  script:
    - bun install --frozen-lockfile
    - bun run lint
    - bun test
    - bun run build
    - bun run cli:build
    - ./dist-cli/lazy --version
  artifacts:
    paths: [dist/]
    expire_in: 1 week

.docs-build:
  stage: docs
  cache:
    key:
      files: [docs/bun.lock]
    paths: [docs/node_modules]
  script:
    # CI_PAGES_URL is https://<user>.gitlab.io/lazylab, or a unique domain with no path.
    # Its path becomes Eleventy's prefix so links and assets resolve in both cases.
    - export DOCS_PATH_PREFIX="$(echo "${CI_PAGES_URL:-}" | sed -E 's#^https?://[^/]+##; s#/*$#/#')"
    - export DOCS_SITE_URL="${CI_PAGES_URL:-}"
    - echo "Building docs with path prefix ${DOCS_PATH_PREFIX}"
    - cd docs
    - bun install --frozen-lockfile
    - bun run build
    - rm -rf "$CI_PROJECT_DIR/public" && mv _site "$CI_PROJECT_DIR/public"

# Merge requests that touch the docs: build only, so a broken page fails the MR.
docs:build:
  extends: .docs-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [docs/**/*, .gitlab-ci.yml]

# Default branch: publish docs/_site as the Pages site.
pages:
  extends: .docs-build
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [docs/**/*, .gitlab-ci.yml]
